<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

    <title>קצין רכב</title>
    <meta name="description" content="קצין רכב — ניהול חכם של רכבי המשפחה: חידושי ביטוח ורישיון, טיפולים והתראות." />

    <!-- Favicon + PWA icons. The same logo file backs every size — the browser
         picks the closest match. Replace with proper resized variants later if
         visual quality at small sizes matters. -->

    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Match the app's dark-purple gradient so the iOS/Android status bar
         and the PWA splash blend in. -->
    <meta name="theme-color" content="#1E1B4B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="קצין רכב" />
  </head>
